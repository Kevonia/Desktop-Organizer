<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" aria-label="SWOT: strong product and safety; distribution and trust are the gaps" font-family="Segoe UI"><rect width="760" height="408" fill="#ffffff"/><text x="24" y="32" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >Strong product and safety; distribution and trust are the gaps</text><text x="244.0" y="66" font-size="13" font-weight="600" fill="#5c6370" text-anchor="middle" >Helpful</text><text x="572.0" y="66" font-size="13" font-weight="600" fill="#5c6370" text-anchor="middle" >Harmful</text><text x="60" y="152.0" font-size="13" font-weight="600" fill="#5c6370" text-anchor="middle" transform="rotate(-90 60 152.0)">Internal</text><text x="60" y="312.0" font-size="13" font-weight="600" fill="#5c6370" text-anchor="middle" transform="rotate(-90 60 312.0)">External</text><rect x="88" y="80" width="312" height="144" rx="8" fill="#ebf5ee" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="108" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >Strengths</text><text x="104" y="136" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Undo for every run; nothing is overwritten</text><text x="104" y="158" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Rules, custom structures and auto-organize</text><text x="104" y="180" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Runs locally: no account, no data collected</text><text x="104" y="202" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Installer built and tested; 93 automated tests</text><rect x="416" y="80" width="312" height="144" rx="8" fill="#fbeeee" stroke="#c4c7c5" stroke-width="1.25"/><text x="432" y="108" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >Weaknesses</text><text x="432" y="136" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Windows only; no macOS build yet</text><text x="432" y="158" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Installer not code-signed (Windows warning)</text><text x="432" y="180" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >No users, reviews or brand yet</text><text x="432" y="202" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >One-person team; limited support capacity</text><rect x="88" y="240" width="312" height="144" rx="8" fill="#ebf5ee" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="268" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >Opportunities</text><text x="104" y="296" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Cluttered Desktops and Downloads everywhere</text><text x="104" y="318" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Paid automation: watch, schedules, rules</text><text x="104" y="340" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Microsoft Store and software download sites</text><text x="104" y="362" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Later: macOS build and business licences</text><rect x="416" y="240" width="312" height="144" rx="8" fill="#fbeeee" stroke="#c4c7c5" stroke-width="1.25"/><text x="432" y="268" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >Threats</text><text x="432" y="296" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Free tools and Windows features that tidy</text><text x="432" y="318" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >AI assistants that sort files on request</text><text x="432" y="340" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Antivirus false alarms hurt trust</text><text x="432" y="362" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >People wary of apps that move their files</text></svg>