<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 712" width="760" height="712" role="img" aria-label="Roadmap: four releases done; licensing is next, then launch" font-family="Segoe UI"><rect width="760" height="712" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >Four releases done; licensing is next, then launch</text><line x1="48" y1="96.0" x2="48" y2="656.0" stroke="#c4c7c5" stroke-width="1.25"/><circle cx="48" cy="96.0" r="7" fill="#2e9a52" stroke="#2e9a52" stroke-width="1.5"/><rect x="88" y="64" width="648" height="64" rx="8" fill="none" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="90" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >1.0 · Desktop app</text><text x="720" y="90" font-size="13" font-weight="400" fill="#5c6370" text-anchor="end" >Done</text><text x="104" y="112" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Engine with undo, any folder, custom structures, safety checks, Windows installer</text><circle cx="48" cy="176.0" r="7" fill="#2e9a52" stroke="#2e9a52" stroke-width="1.5"/><rect x="88" y="144" width="648" height="64" rx="8" fill="none" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="170" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >1.1 · Automation</text><text x="720" y="170" font-size="13" font-weight="400" fill="#5c6370" text-anchor="end" >Done</text><text x="104" y="192" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Rules, auto-organize (watch, hourly, daily), tray, start with Windows, duplicate finder</text><circle cx="48" cy="256.0" r="7" fill="#2e9a52" stroke="#2e9a52" stroke-width="1.5"/><rect x="88" y="224" width="648" height="64" rx="8" fill="none" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="250" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >1.2 · Launch readiness</text><text x="720" y="250" font-size="13" font-weight="400" fill="#5c6370" text-anchor="end" >Done</text><text x="104" y="272" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >One copy at a time, update checker, error log and crash dialog, licence notices</text><circle cx="48" cy="336.0" r="7" fill="#2e9a52" stroke="#2e9a52" stroke-width="1.5"/><rect x="88" y="304" width="648" height="64" rx="8" fill="none" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="330" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >1.3 · Find &amp; recover</text><text x="720" y="330" font-size="13" font-weight="400" fill="#5c6370" text-anchor="end" >Done</text><text x="104" y="352" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Find where files went, keep the last 4 versions of files, restore from the Recycle Bin</text><circle cx="48" cy="456.0" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><rect x="88" y="424" width="648" height="64" rx="8" fill="#e6eefc" stroke="#2563eb" stroke-width="2"/><text x="104" y="450" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >1.4 · Licensing</text><text x="720" y="450" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end" >Next</text><text x="104" y="472" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Free and Premium tiers, license keys, 14-day trial, upgrade screen, payment service</text><circle cx="48" cy="576.0" r="7" fill="#ffffff" stroke="#c4c7c5" stroke-width="1.5"/><rect x="88" y="544" width="648" height="64" rx="8" fill="none" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="570" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >1.5 · Public launch</text><text x="720" y="570" font-size="13" font-weight="400" fill="#5c6370" text-anchor="end" >Planned</text><text x="104" y="592" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Code signing, first GitHub release, website and announcement</text><circle cx="48" cy="656.0" r="7" f