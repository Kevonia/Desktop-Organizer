<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 552" width="760" height="552" role="img" aria-label="Roadmap: two releases done; licensing is next, then launch" font-family="Segoe UI"><rect width="760" height="552" fill="#ffffff"/><text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >Two releases done; licensing is next, then launch</text><line x1="48" y1="96.0" x2="48" y2="496.0" stroke="#c4c7c5" stroke-width="1.25"/><circle cx="48" cy="96.0" r="7" fill="#2e9a52" stroke="#2e9a52" stroke-width="1.5"/><rect x="88" y="64" width="648" height="64" rx="8" fill="none" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="90" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >1.0 · Desktop app</text><text x="720" y="90" font-size="13" font-weight="400" fill="#5c6370" text-anchor="end" >Done</text><text x="104" y="112" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Engine with undo, any folder, custom structures, safety checks, Windows installer</text><circle cx="48" cy="176.0" r="7" fill="#2e9a52" stroke="#2e9a52" stroke-width="1.5"/><rect x="88" y="144" width="648" height="64" rx="8" fill="none" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="170" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >1.1 · Automation</text><text x="720" y="170" font-size="13" font-weight="400" fill="#5c6370" text-anchor="end" >Done</text><text x="104" y="192" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Rules, auto-organize (watch, hourly, daily), tray, start with Windows, duplicate finder</text><circle cx="48" cy="296.0" r="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/><rect x="88" y="264" width="648" height="64" rx="8" fill="#e6eefc" stroke="#2563eb" stroke-width="2"/><text x="104" y="290" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >1.2 · Licensing</text><text x="720" y="290" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end" >Next</text><text x="104" y="312" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Free and Premium tiers, license keys, 14-day trial, upgrade screen, payment service</text><circle cx="48" cy="416.0" r="7" fill="#ffffff" stroke="#c4c7c5" stroke-width="1.5"/><rect x="88" y="384" width="648" height="64" rx="8" fill="none" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="410" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >1.3 · Public launch</text><text x="720" y="410" font-size="13" font-weight="400" fill="#5c6370" text-anchor="end" >Planned</text><text x="104" y="432" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >Code signing, auto-update, error reports, website and the first public release</text><circle cx="48" cy="496.0" r="7" fill="#ffffff" stroke="#c4c7c5" stroke-width="1.5"/><rect x="88" y="464" width="648" height="64" rx="8" fill="none" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="490" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start" >2.x · Growth</text><text x="720" y="490" font-size="13" font-weight="400" fill="#5c6370" text-anchor="end" >Later</text><text x="104" y="512" font-size="11.5" font-weight="400" fill="#1f2328" text-anchor="start" >macOS build, Microsoft Store listing, business licences</text><path d="M48 227l9 9l-9 9l-9 -9z" fill="#eef0ee" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="240" font-size="12" font-weight="600" fill="#5c6370" text-anchor="start" >Gate: price, free tier and payment service decided</text><path d="M48 347l9 9l-9 9l-9 -9z" fill="#eef0ee" stroke="#c4c7c5" stroke-width="1.25"/><text x="104" y="360" font-size="12" font-weight="600" fill="#5c6370" text-anchor="start" >Gate: code-signing certificate in hand</text></svg>